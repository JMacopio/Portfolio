<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="The Coin Collector logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="gold" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFE98A"/>
      <stop offset="55%" stop-color="#FFC81E"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Badge background -->
  <rect x="8" y="8" width="496" height="496" rx="90" fill="#DFD0B8" stroke="#1a1a1a" stroke-width="8"/>
  <rect x="40" y="40" width="432" height="432" rx="62" fill="#FFF8F8" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Dotted trail (player path) -->
  <g fill="#1f4fff" opacity="0.35">
    <rect x="96" y="318" width="10" height="10"/>
    <rect x="126" y="298" width="10" height="10"/>
    <rect x="156" y="278" width="10" height="10"/>
    <rect x="186" y="258" width="10" height="10"/>
  </g>

  <!-- Red obstacles -->
  <rect x="352" y="84" width="62" height="46" fill="#E02424" stroke="#1a1a1a" stroke-width="5" transform="rotate(8 383 107)"/>
  <rect x="392" y="262" width="44" height="58" fill="#E02424" stroke="#1a1a1a" stroke-width="5" transform="rotate(-10 414 291)"/>
  <rect x="82" y="96" width="40" height="40" fill="#E02424" stroke="#1a1a1a" stroke-width="5" transform="rotate(-12 102 116)"/>

  <!-- Player (blue square) -->
  <rect x="198" y="236" width="40" height="40" fill="#1f4fff" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="208" y="246" width="8" height="8" fill="#fff"/>
  <rect x="222" y="246" width="8" height="8" fill="#fff"/>

  <!-- Coin -->
  <g filter="url(#shadow)">
    <circle cx="316" cy="216" r="72" fill="url(#gold)" stroke="#1a1a1a" stroke-width="6"/>
    <circle cx="316" cy="216" r="54" fill="none" stroke="#B87F00" stroke-width="5"/>
    <text x="316" y="242" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="76" fill="#B87F00">$</text>
    <path d="M276 180 A52 52 0 0 1 318 160" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Title -->
  <text x="256" y="388" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="48" fill="#1a1a1a" letter-spacing="2">COIN COLLECTOR</text>
  <rect x="96" y="404" width="320" height="34" rx="17" fill="#1a1a1a"/>
  <text x="256" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#FFC81E" letter-spacing="5">UNFINISHABLE</text>
</svg>
